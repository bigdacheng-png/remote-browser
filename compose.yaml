name: remote-browser
services:
  chromium:
    image: lscr.io/linuxserver/chromium:latest
    environment:
      PUID: "${BROWSER_UID:-1000}"
      PGID: "${BROWSER_GID:-1000}"
      TZ: Asia/Shanghai
      LC_ALL: zh_CN.UTF-8
    volumes:
      - ./data:/config
    ports:
      # 容器内 3000 是纯 HTTP,3001 是 HTTPS;映射到 3000 即可直接 http 访问
      # 绑定 0.0.0.0,允许局域网其他设备访问
      - "3001:3000"
    shm_size: "1gb"
    restart: unless-stopped
